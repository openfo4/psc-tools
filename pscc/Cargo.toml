[package]
name = "pscc"
version = "0.1.0"
edition = "2024"

[dependencies]
pex = { version = "0.1.0", path = "../pex" }

clap = { version = "4.6.4", features = ["derive"] }
codespan-reporting = "0.13.1"
thiserror = "2.0.19"

[dev-dependencies]
pex-runner = { version = "0.1.0", path = "../pex-runner" }
bstr = { version = "1.13.1", default-features = false, features = ["alloc"] }

[[test]]
name = "ui"
harness = false
